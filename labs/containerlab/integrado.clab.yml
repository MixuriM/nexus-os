name: integrado

# Cenário integrado (F4.3): r1 e r2 ligados pela ponte Open vSwitch br-integrado, que o Containerlab não cria:
# crie antes com "ovs-vsctl add-br br-integrado" (kind ovs-bridge, https://containerlab.dev/manual/kinds/ovs-bridge).
# As regras OpenFlow vêm de sdn/flows/integrado.flows e são carregadas depois do deploy.
topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.7.1
  nodes:
    br-integrado:
      kind: ovs-bridge
    r1:
      kind: linux
      binds:
        - configs/int-r1/daemons:/etc/frr/daemons
        - configs/int-r1/frr.conf:/etc/frr/frr.conf
    r2:
      kind: linux
      binds:
        - configs/int-r2/daemons:/etc/frr/daemons
        - configs/int-r2/frr.conf:/etc/frr/frr.conf
  links:
    - endpoints: ["r1:eth1", "br-integrado:ovsp1"]
    - endpoints: ["r2:eth1", "br-integrado:ovsp2"]
