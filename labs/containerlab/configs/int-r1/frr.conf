frr defaults traditional
hostname r1
log stdout
!
interface lo
 ip address 198.51.100.21/32
 ip ospf area 0
exit
!
interface eth1
 ip address 203.0.113.5/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
router ospf
 ospf router-id 198.51.100.21
exit
!
