source /boot/grub/config.cfg

menuentry "Iniciar o Nexus OS" --hotkey=n {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Iniciar o Nexus OS (modo de demonstração)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nexus.demo=1
	initrd	@INITRD_LIVE@
}

menuentry "Nexus OS (modo de compatibilidade)" {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}
