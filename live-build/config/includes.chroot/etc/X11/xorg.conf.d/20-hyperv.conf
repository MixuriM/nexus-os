# Vídeo do Hyper-V (Geração 1): o Xorg não casa o /dev/dri/card0 sozinho e o lightdm falha em laço.
# Fixa o dispositivo KMS (F3.17, issue 55). No QEMU o smoke desktop confere que a sessão segue subindo.
Section "Device"
    Identifier "Nexus-KMS"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
EndSection
