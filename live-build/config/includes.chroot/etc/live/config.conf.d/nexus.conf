# Lido pelo live-config (/usr/lib/live/init-config.sh). Grupos padrão do Debian Live mais libvirt (F3.3) e
# wireshark (captura sem root, F3.17).
LIVE_USER_DEFAULT_GROUPS="audio cdrom dip floppy video plugdev netdev powerdev scanner bluetooth debian-tor libvirt wireshark"
# F3.17: o nome completo do usuário aparece na barra e no login ("Debian Live user" por padrão).
LIVE_USER_FULLNAME="Nexus OS"
# F3.17: português do Brasil, teclado ABNT2, horário de Brasília e nome da máquina nexus-os (no lugar de "debian").
LIVE_LOCALES="pt_BR.UTF-8"
LIVE_TIMEZONE="America/Sao_Paulo"
LIVE_KEYBOARD_MODEL="abnt2"
LIVE_KEYBOARD_LAYOUTS="br"
LIVE_HOSTNAME="nexus-os"
