! Configuração de exemplo do FRR na ISO (F3.5): um roteador com o loopback em OSPF área 0.
! Endereço do bloco de documentação RFC 5737. Para aplicar: veja docs/nfv.md.
frr defaults traditional
hostname ex1
log syslog informational
!
interface lo
 ip address 198.51.100.10/32
 ip ospf area 0
exit
!
router ospf
 ospf router-id 198.51.100.10
exit
!
